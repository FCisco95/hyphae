app = "hyphae-api"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"

[processes]
  api = "node dist/server.js"
  worker = "node dist/worker.js"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["api"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
