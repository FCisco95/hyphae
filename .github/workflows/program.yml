name: Program

# The SBF toolchain install takes minutes, so the program builds weekly and on demand, not on
# every push.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  anchor:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SOLANA_VERSION: 3.1.10
      ANCHOR_VERSION: 1.0.1
    steps:
      - uses: actions/checkout@v5
      - name: Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v${SOLANA_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        id: anchor-cache
        with:
          path: ~/.cargo/bin/anchor
          key: anchor-cli-${{ env.ANCHOR_VERSION }}-${{ runner.os }}
      # Installed from $HOME, so the repo's pinned program toolchain does not build the CLI.
      - name: Anchor CLI
        if: steps.anchor-cache.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}
        run: cargo install --git https://github.com/solana-foundation/anchor --tag "v${ANCHOR_VERSION}" anchor-cli --locked
      - run: anchor --version && solana --version
      # The program keypair is never committed; declare_id! pins the address, so a fresh clone's
      # generated keypair is ignored.
      - run: anchor build --ignore-keys
      - run: sha256sum target/deploy/hyphae.so
      - run: cargo test -p hyphae --tests
